[project]
name = "rangeland-analysis"
version = "1.0.0"
description = "Weighted-overlay analysis service for Rangeland Awareness: criteria layers in, hotspot index and classified layers out."
readme = "README.md"

# 3.12 rather than the 3.14 on this machine, and deliberately so. rasterio,
# geopandas and scipy are compiled, and their wheels routinely lag a new CPython
# release by months. A 3.14 environment may have to build GDAL from source or
# may simply fail to resolve. The upper bound is a signpost, not a preference:
# nothing here uses a 3.13+ feature, so widening it is a one-line change once
# the geospatial wheels exist.
requires-python = ">=3.12,<3.14"

dependencies = [
  # The API surface. Pure Python, installs anywhere.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "httpx>=0.27",

  # The computation. All compiled, all GDAL-adjacent, all the reason for the
  # interpreter pin above.
  "numpy>=1.26",
  "rasterio>=1.3",
  "geopandas>=1.0",
  "scipy>=1.11",
  "jenkspy>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# The geospatial stack ships incomplete or absent stubs. Their own modules are
# excused; ours are not, which is where the value is.
[[tool.mypy.overrides]]
module = ["rasterio.*", "geopandas.*", "jenkspy.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tested modules have no third-party imports on purpose, so this suite also
# runs under `python3 -m unittest discover -s tests -t .` with nothing
# installed. Keep it that way for anything that does not need a raster.
